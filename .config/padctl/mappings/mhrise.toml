# Device: Flydigi Vader 5 Pro
name = "Monster Hunter Rise"
output.emulate = "dualsense-edge"

[remap]
# I tend to click LS/RS inadvertently, unmap
LS = "disabled"
RS = "disabled"

M1 = "RB"                                   # right front paddle
M2 = "LB"                                   # Left front paddle
M3 = "RS"                                   # right back paddle
M4 = "LS"                                   # left back paddle
RM = "RB"                                   # right extra bumper
LM = "LB"                                   # left extra bumper
# RB = left as is
# LB = left as is

C = "disabled"
Z = "disabled"
O = "KEY_HOME" # skip final quest end timer
