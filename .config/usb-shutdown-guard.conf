# USB Shutdown Guard settings. Run `usb-shutdown-guard list` to see your devices.
# Changes take effect at the next shutdown; no restart needed.

# Devices to remind you about, one line each:
#   DEVICE=vendor:product            show the name the device reports
#   DEVICE=vendor:product Your name  show your own name instead
DEVICE=30be:1019 Schiit Jotunheim

# Seconds to wait for the devices to be switched off before continuing anyway (min 10).
# For terminal shutdowns, logind's InhibitDelayMaxSec also caps this (see README).
TIMEOUT=60

# When to remind: poweroff, reboot, logout, unknown (comma-separated).
#   unknown = shutting down, but it isn't clear how (a safety net).
REMIND_ON=poweroff,unknown
